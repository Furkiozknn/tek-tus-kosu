<!DOCTYPE html>
<html lang="tr">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#14142a">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
/* Tek Tuş Koşu — özel web kabuğu (v1.4). Godot'nun varsayılan kabuğunun yükleme ekranı oyunun gece paletiyle
   yeniden çizildi: tek vurgu rengi (başlıktaki cam göbeği), sistem yazı tipi, yalnız transform/opacity animasyonu,
   sabit hızlı ilerleme için linear, giriş/çıkış için güçlü ease-out, azaltılmış hareket desteği. */
:root {
	--zemin: #14142a;          /* oyunun gece göğü (saf siyah değil) */
	--zemin-ust: #1e1e3c;
	--metin: #e6ecf7;
	--metin-soluk: #8b9bb4;
	--vurgu: #56e8ff;          /* menü başlığındaki cam göbeği */
	--vurgu-koyu: #1f6b7a;
	--hata-zemin: #3a1e2a;
	--hata-kenar: #8a3a4d;
	--ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--metin);
	background-color: var(--zemin);
	overflow: hidden;
	touch-action: none;
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background: linear-gradient(180deg, var(--zemin) 0%, var(--zemin-ust) 100%);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	opacity: 1;
	transition: opacity 220ms var(--ease-out);
}

#status.kapaniyor {
	opacity: 0;
	pointer-events: none;
}

/* Çatı çizgisi: ekranın altında ince bir hat ve seyrek pencere ışıkları (sabit, dekoratif, hareketsiz) */
#status::after {
	content: "";
	position: absolute;
	left: 0;
	right: 0;
	bottom: 18%;
	height: 2px;
	background: var(--vurgu-koyu);
	opacity: 0.55;
}

#yukleme {
	width: min(72vw, 420px);
	display: flex;
	flex-direction: column;
	gap: 14px;
	opacity: 0;
	transform: translateY(8px);
	animation: giris 260ms var(--ease-out) forwards;
}

@keyframes giris {
	to { opacity: 1; transform: translateY(0); }
}

#baslik {
	margin: 0;
	font-size: clamp(28px, 6vw, 44px);
	font-weight: 800;
	letter-spacing: -0.02em;
	line-height: 1.05;
	color: var(--vurgu);
	text-transform: uppercase;
}

#altbaslik {
	margin: 0;
	font-size: clamp(13px, 2vw, 15px);
	line-height: 1.4;
	color: var(--metin-soluk);
	max-width: 42ch;
}

#cubuk {
	position: relative;
	height: 6px;
	background: rgba(230, 236, 247, 0.12);
	border-radius: 3px;
	overflow: hidden;
	margin-top: 6px;
}

#cubuk-dolu {
	position: absolute;
	inset: 0;
	background: var(--vurgu);
	border-radius: 3px;
	transform-origin: left center;
	transform: scaleX(0);
	transition: transform 160ms linear;   /* sabit hızlı ilerleme: linear */
}

#cubuk.belirsiz #cubuk-dolu {
	transform: scaleX(0.3);
	animation: sur 1.1s linear infinite;
}

@keyframes sur {
	from { transform: translateX(-100%) scaleX(0.3); }
	to { transform: translateX(333%) scaleX(0.3); }
}

#satir {
	display: flex;
	justify-content: space-between;
	font-size: 12px;
	color: var(--metin-soluk);
	font-variant-numeric: tabular-nums;
}

#status-notice {
	display: none;
	background-color: var(--hata-zemin);
	border-radius: 8px;
	border: 1px solid var(--hata-kenar);
	color: var(--metin);
	line-height: 1.4;
	margin: 18px 2rem 0;
	max-width: 520px;
	overflow: hidden;
	padding: 14px 16px;
	text-align: center;
	font-size: 14px;
	z-index: 1;
}

@media (prefers-reduced-motion: reduce) {
	#yukleme { transform: none; animation: solma 200ms ease forwards; }
	@keyframes solma { to { opacity: 1; } }
	#cubuk.belirsiz #cubuk-dolu { animation: none; transform: scaleX(0.5); }
	#status { transition-duration: 120ms; }
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Tarayıcın canvas etiketini desteklemiyor.
		</canvas>

		<noscript>
			Tarayıcın JavaScript'i desteklemiyor.
		</noscript>

		<div id="status">
			<div id="yukleme" role="status" aria-live="polite">
				<h1 id="baslik">Tek Tuş Koşu</h1>
				<p id="altbaslik">Tek tuş, çatılar, ritim. Boşluk ya da dokunuş: zıpla. Kısa dokunuş: alçak tavanın altından geç.</p>
				<div id="cubuk" class="belirsiz"><div id="cubuk-dolu"></div></div>
				<div id="satir"><span id="durum">Yükleniyor</span><span id="yuzde"></span></div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const yukleme = document.getElementById('yukleme');
	const cubuk = document.getElementById('cubuk');
	const cubukDolu = document.getElementById('cubuk-dolu');
	const durum = document.getElementById('durum');
	const yuzde = document.getElementById('yuzde');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			initializing = false;
			// Çıkış girişin tersi: 220 ms solma, sonra kaldır (azaltılmış harekette 120 ms).
			statusOverlay.classList.add('kapaniyor');
			const kaldir = () => statusOverlay.remove();
			statusOverlay.addEventListener('transitionend', kaldir, { once: true });
			setTimeout(kaldir, 400);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		yukleme.style.display = mode === 'progress' ? 'flex' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('Bilinmeyen bir hata oluştu.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Hata\nTarayıcıda Godot web oyunları için gereken şu özellikler eksik:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const oran = Math.min(1, current / total);
					cubuk.classList.remove('belirsiz');
					cubukDolu.style.transform = 'scaleX(' + oran.toFixed(3) + ')';
					yuzde.textContent = Math.round(oran * 100) + '%';
					durum.textContent = oran >= 1 ? 'Başlatılıyor' : 'Yükleniyor';
				} else {
					cubuk.classList.add('belirsiz');
					yuzde.textContent = '';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
