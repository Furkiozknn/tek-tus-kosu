name: Yapi

# Oynanabilir bir derleme uretir ve CI artifact'i olarak birakir.
#
# Bilerek SADECE elle tetiklenir. Varsayilan davranisi HICBIR SEY
# YAYIMLAMAMAKTIR: amaci, oyunu oynayip dogrulamak isteyen kisinin Godot
# kurmadan bir paket indirebilmesi -- yayin karari oynandiktan sonra
# verilir.
#
# Oynadiktan sonra yayinlamak icin: Run workflow penceresinde
# "sayfaya_yayinla" kutusunu isaretle. O zaman ayni web paketi GitHub
# Pages'e gider ve oyun tarayicidan oynanabilir olur. Kutu
# isaretlenmedikce Pages'e dokunulmaz.
#
# Paket boyutlari adimda yazdiriliyor; disa aktarma suzgecinin oyuncuya
# inen pakete ne koydugu boylece olculuyor, tahmin edilmiyor.
#
# Web paketi artifact'e ve Pages'e gitmeden once tarayicida acilir
# (tools/web_duman.py): yukleme ekrani kalkmali, menu cizilmeli, Bosluk ile
# kosu baslamali, konsolda betik hatasi olmamali. Duman testi duserse is
# kirmizi olur ve "sayfa" isi hic kosmaz.

on:
  workflow_dispatch:
    inputs:
      sayfaya_yayinla:
        description: "Web paketini GitHub Pages'e yayinla (varsayilan: yalniz artifact)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yapi-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI testleriyle ayni sabit surum. "latest", motor guncellenince
  # depodan bagimsiz bir kirmizi uretirdi.
  GODOT_SURUM: 4.7.2-stable
  GODOT_SABLON: 4.7.2.stable

jobs:
  yapi:
    name: Windows + Web disa aktar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Varliklar Git LFS'te; cekilmezse sahneler "bozuk kaynak" duser.
          lfs: true

      - name: Godot ve disa aktarma sablonlari
        run: |
          set -euo pipefail
          ad="Godot_v${GODOT_SURUM}_linux.x86_64"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_SURUM}/${ad}.zip"
          unzip -q godot.zip
          chmod +x "$ad"
          sudo mv "$ad" /usr/local/bin/godot
          curl -fsSL -o sablon.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_SURUM}/Godot_v${GODOT_SURUM}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_SABLON}"
          unzip -q sablon.tpz -d sablon
          mv sablon/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_SABLON}/"
          godot --version

      # Ice aktarma ayri adim: taze checkout'ta .godot yok ve eksik
      # onbellek, disa aktarmayi ilgisiz hatalarla dusuruyor.
      - name: Projeyi ice aktar
        run: godot --headless --path . --import

      - name: Disa aktar
        run: |
          set -euo pipefail
          mkdir -p build/windows build/web
          godot --headless --path . --export-release "Windows Desktop" "build/windows/tek-tus-kosu.exe"
          godot --headless --path . --export-release "Web" "build/web/index.html"

      - name: Paket boyutlari
        run: |
          set -euo pipefail
          echo "--- web ---"
          ls -l build/web
          if [ -f build/web/index.pck ]; then
            echo "web pck: $(stat -c%s build/web/index.pck) bayt"
          fi
          echo "--- windows ---"
          ls -l build/windows
          du -sh build/web build/windows

      # Motorun ici testlerde; bu adim motorun DISINI sinar: web kabugu,
      # .pck yukleme, WebGL 2 (SwiftShader) ve tarayicidaki girdi.
      - name: Web duman testi (Chromium)
        run: |
          set -euo pipefail
          # Runner'in sistem Python'u PEP 668 ile korunuyor; ayri venv.
          python3 -m venv "$RUNNER_TEMP/duman"
          py="$RUNNER_TEMP/duman/bin/python"
          "$py" -m pip install --quiet playwright==1.63.0 pillow==12.3.0
          "$py" -m playwright install --with-deps chromium
          "$py" tools/web_duman.py build/web --cikti build/duman

      - name: Duman testi ekran goruntuleri
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tek-tus-kosu-duman
          path: build/duman
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: tek-tus-kosu-web
          path: build/web
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: tek-tus-kosu-windows
          path: build/windows
          if-no-files-found: error

  sayfa:
    name: GitHub Pages'e yayinla
    needs: yapi
    # Kutu isaretlenmedikce bu is hic kosmaz; varsayilan yayimlamamaktir.
    if: ${{ inputs.sayfaya_yayinla }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tek-tus-kosu-web
          path: web

      # enablement: true -- depoda Pages hic acilmamissa bu adim aciyor,
      # yani ayarlara elle girmek gerekmiyor.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: dagit
        uses: actions/deploy-pages@v4
