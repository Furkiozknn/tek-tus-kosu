name: CI

# Depo 21 Eylul 2026'da GitHub'a tasindi; o zamana kadar 853 test yalniz elle
# kosuyordu.
#
# Yeni test komutu UYDURULMUYOR: CLAUDE.md "Komutlar" bolumunde yazan kapinin aynisi kosuluyor.
# Test betigi `quit(1 if hata > 0 else 0)` ile bitiyor -- cikis kodu 0 = gecti.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # project.godot: config/features = "4.7". Surum SABIT tutuluyor --
  # "latest" kullanmak, motor guncellenince testlerin bizden habersiz
  # kirmizi yanmasi demek olurdu.
  GODOT_SURUM: 4.7.2-stable
  # Test kapisinin tabani: gecen dogrulama sayisi bunun altina duserse CI
  # kirmizi. Test EKLEYINCE yukselt (README, project-meta.json ile birlikte);
  # dusurmek, bir bolumun sessizce kayboldugunu kabul etmek demek.
  TEST_TABANI: 961

jobs:
  testler:
    runs-on: ubuntu-latest
    # Normal kosu ~40 sn. Bir coroutine'in `await`i hic donmezse takim
    # sonsuza kadar bekler; 6 saatlik varsayilan yerine erken kirmizi.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # PNG/WAV/TTF Git LFS'te (.gitattributes). LFS cekilmezse
          # checkout yalnizca ~130 baytlik isaretci dosyalari getirir ve
          # ice aktarma bozuk varlik uretir.
          lfs: true

      - name: Godot ${{ env.GODOT_SURUM }} indir
        run: |
          set -euo pipefail
          ad="Godot_v${GODOT_SURUM}_linux.x86_64"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_SURUM}/${ad}.zip"
          unzip -q godot.zip
          chmod +x "$ad"
          sudo mv "$ad" /usr/local/bin/godot
          godot --version

      # Ice aktarma AYRI adim: taze checkout'ta .godot onbellegi hic yok,
      # eksik onbellek testin icerigiyle ilgisi olmayan ayristirma
      # hatalari uretiyor.
      - name: Projeyi ice aktar
        run: godot --headless --path . --import

      # --fixed-fps 60 SART: testlerin bir bolumu fizik karesi adimlayarak
      # zamanlama olcuyor (ziplama boyu, ritim vurus penceresi).
      #
      # Cikis kodu tek basina yetmiyor: bir test fonksiyonundaki calisma
      # zamani hatasi yalnizca o fonksiyonu keser, kalan dogrulamalar
      # sayilmaz ve takim yine "0 hata" ile 0 doner. tests/kapi.sh gunlugu
      # okuyup SONUC satirini, tabani ve "SCRIPT ERROR" yoklugunu zorunlu
      # kiliyor.
      - name: Testler (en az ${{ env.TEST_TABANI }})
        run: |
          set -o pipefail
          godot --headless --fixed-fps 60 --path . -s res://tests/testler.gd 2>&1 | tee test.log
          bash tests/kapi.sh test.log "$TEST_TABANI"

  referanslar:
    name: Kaynak referanslari saglam mi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      # Test kapisinin kendi sinamasi: Godot gerektirmez, bu yuzden motoru
      # indirmeyen bu iste. Kapi bozulursa (ornegin SCRIPT ERROR aramasi
      # silinirse) burada kirmizi yanar.
      - name: Test kapisi sinamasi
        run: bash tests/kapi_sinama.sh

      # Kirik bir kaynak referansi motoru her zaman durdurmuyor: eksik bir
      # .tscn ya da silinmis bir .png, sahne o kod yolu calisana kadar
      # sessiz kalabiliyor -- yani testler yesilken de var olabiliyor.
      # Bu kontrol motoru indirmeden, ayni hesaptaki godot-refcheck ile
      # yapiliyor; su an temiz (222 dosya, 215 referans, sifir
      # bulgu) ve bu commit'ten sonra oyle kalmasi garanti.
      - name: godot-refcheck
        uses: Furkiozknn/godot-refcheck@b083e3d2998ca0d5101289b106c76794c6de866d  # v0.2.0 + the clean-project fix
        with:
          path: .
          fail-on: error
          sarif: refcheck.sarif

      # Catal (fork) PR'larinda GITHUB_TOKEN'a security-events: write
      # verilmiyor; yukleme orada her zaman duser ve dis katkiyi haksiz yere
      # kirmizi gosterirdi. Bulgu varsa godot-refcheck adimi zaten dusuruyor.
      - name: SARIF raporunu kod taramaya yukle
        if: >-
          always() && hashFiles('refcheck.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: refcheck.sarif
          category: godot-refcheck
